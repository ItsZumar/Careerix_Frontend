services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: careerix-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: careerix
    volumes:
      - mongodb_data:/data/db
    networks:
      - careerix-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend Service
  backend:
    build:
      context: ./careerix-backend
      dockerfile: Dockerfile.dev
    container_name: careerix-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/careerix
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}
      - FRONTEND_URL=http://localhost:8081
    volumes:
      - ./careerix-backend:/app
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - careerix-network
    command: npm run start:dev

  # Frontend Service
  frontend:
    build:
      context: ./careerix-frontend
      dockerfile: Dockerfile
    container_name: careerix-frontend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - EXPO_PUBLIC_API_URL=http://localhost:3000
    volumes:
      - ./careerix-frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - careerix-network

networks:
  careerix-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local

